---
layout: default
---

<article class="post-wrap">
  <header class="post-header">
    <div class="eyebrow">■ {{ page.tag | default: "Artículo" }}</div>
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      {{ page.date | date: "%d de %B, %Y" }}{% if page.readTime %} · {{ page.readTime }} lectura{% endif %}
    </div>
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <div class="post-footer">
    <a href="/articulos/" class="rlink">← Volver a artículos</a>
  </div>
</article>
