<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <meta name="author" content="Manuel Absaí" />
  <title>{{ page.title | default: site.title }}</title>
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav-in">
      <a class="logo" href="/">
        <img src="/assets/logo.jpg" alt="MA" />
        Manuel Absaí
      </a>
      <div class="nav-menu">
        <a class="ni" href="/">Inicio</a>
        <a class="ni" href="/articulos">Artículos</a>
        <a class="ni" href="/sobre-mi">Sobre mí</a>
        <a class="ni" href="/contacto">Contacto</a>
      </div>
      <button class="nav-toggle" id="hamburger" onclick="toggleMenu()" aria-label="Menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
    <div class="nav-mobile" id="nav-mobile">
      <a class="ni-mob" href="/">Inicio</a>
      <a class="ni-mob" href="/articulos">Artículos</a>
      <a class="ni-mob" href="/sobre-mi">Sobre mí</a>
      <a class="ni-mob" href="/contacto">Contacto</a>
    </div>
  </nav>

  {{ content }}

  <script>
    let menuOpen = false;
    function toggleMenu() {
      menuOpen = !menuOpen;
      document.getElementById('nav-mobile').classList.toggle('open', menuOpen);
      document.getElementById('hamburger').innerHTML = menuOpen
        ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
        : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>';
    }
  </script>
</body>
</html>
